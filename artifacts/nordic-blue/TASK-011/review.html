<h1>Nordic Blue · Grid, Tree и paging</h1><p class="note">TASK-011. Цвета строк, выделения, заголовков и фокуса. Размеры, шрифты и поведение сохранены. Значки пока Classic; одобренный набор подключается в TASK-013. Это промежуточный этап темы.</p>
<label>Набор <select id="mode"><option value="main">Состояния</option><option value="actions">Действия</option></select></label><select id="component"></select><select id="state"></select><label>Плотность <select id="dpr"><option>1</option><option>2</option></select></label>
<section><article><h2>Classic</h2><a id="classic-link" target="_blank"><img id="classic"></a></article><article><h2>Nordic Blue</h2><a id="nordic-link" target="_blank"><img id="nordic"></a></article></section>
<p><a href="grid-component-report.md">Отчёт</a> · <a href="geometry-comparison.json">Геометрия</a> · <a href="grid-action-comparison.json">Действия</a></p>
<script>
const mode=document.querySelector('#mode'),component=document.querySelector('#component'),state=document.querySelector('#state'),dpr=document.querySelector('#dpr');
const main={"grid": ["normal", "hover", "selected", "focus", "sort-asc", "sort-desc", "menu", "resized", "disabled"], "tree": ["normal", "collapsed", "expanded", "selected", "focus", "disabled"], "paging": ["normal", "first", "middle", "last", "disabled"]};
const actions={"grid": ["grid-sort-asc", "grid-sort-desc", "grid-row-select", "grid-keyboard-next-row", "grid-checkcolumn-toggle", "grid-header-menu-open", "grid-header-menu-escape", "grid-column-resize-drag", "grid-compact-viewport", "grid-scroll-both-axes"], "tree": ["tree-mouse-collapse", "tree-mouse-expand", "tree-leaf-selection", "tree-keyboard-next-leaf", "tree-keyboard-collapse", "tree-keyboard-expand"], "paging": ["paging-first-boundary", "paging-next", "paging-last-boundary", "paging-previous", "paging-first", "paging-input-enter", "paging-refresh"]};
function fill(el,values){el.replaceChildren(...values.map(v=>new Option(v,v)));}function states(){fill(state,(mode.value==='main'?main:actions)[component.value]);show();}function components(){fill(component,Object.keys(main));states();}
function show(){for(const theme of ['classic','nordic']){const path=mode.value==='actions'?`grid-actions/dpr-${dpr.value}/${theme}/${state.value}.png`:theme==='classic'?`../TASK-006/captures/pass-1/dpr-${dpr.value}/${component.value}--${state.value}.png`:`nordic/captures/pass-1/dpr-${dpr.value}/${component.value}--${state.value}.png`;document.getElementById(theme).src=path;document.getElementById(theme+'-link').href=path;}}
mode.onchange=components;component.onchange=states;state.onchange=dpr.onchange=show;components();
</script></html>
