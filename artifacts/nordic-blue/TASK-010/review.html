<!doctype html><html lang="ru"><meta charset="utf-8"><title>Nordic Blue — поля формы</title>
<style>body{margin:20px;font:14px Arial;color:#25374d;background:#f4f7fc}h1{font-size:22px}select{padding:5px;margin-right:10px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}article{background:white;border:1px solid #b7c8dc;padding:12px;min-width:0}img{width:100%;height:auto}h2{font-size:16px}a{color:#2868c4}.note{color:#687b92;max-width:950px}</style>
<h1>Nordic Blue · поля формы</h1><p class="note">TASK-010. Цвета полей, подписей и fieldsets. Размеры, шрифты и поведение сохранены. Значки пока Classic; одобренный набор подключается в TASK-013. Это промежуточный этап темы.</p>
<label>Набор <select id="mode"><option value="main">Состояния</option><option value="actions">Действия</option></select></label><select id="component"></select><select id="state"></select><label>Плотность <select id="dpr"><option>1</option><option>2</option></select></label>
<section><article><h2>Classic</h2><a id="classic-link" target="_blank"><img id="classic"></a></article><article><h2>Nordic Blue</h2><a id="nordic-link" target="_blank"><img id="nordic"></a></article></section>
<p><a href="form-component-report.md">Отчёт</a> · <a href="geometry-comparison.json">Геометрия</a> · <a href="form-action-comparison.json">Действия</a></p>
<script>
const mode=document.querySelector('#mode'),component=document.querySelector('#component'),state=document.querySelector('#state'),dpr=document.querySelector('#dpr');
const main={form:['normal','invalid','readonly','disabled','focus'],triggers:['normal','hover','focus','pressed','disabled','open'],checks:['normal','checked','unchecked','disabled','focus'],fieldset:['normal','collapsed','checked','disabled']};
const actions={form:['text-input','textarea-input','date-input','time-picker-selection','number-keyboard-up','number-keyboard-down','number-max-bound','required-invalid','readonly-blocks-input','disabled-input-state'],triggers:['combo-open','combo-keyboard-selection','spinner-mouse-up','spinner-mouse-down','clear-trigger','date-picker-next-select'],checks:['checkbox-space-on','checkbox-space-off','radio-arrow-selection','checkbox-disabled-state'],fieldset:['fieldset-collapse','fieldset-expand','fieldset-checkbox-expand','fieldset-checkbox-collapse']};
function fill(el,values){el.replaceChildren(...values.map(v=>new Option(v,v)));}function states(){fill(state,(mode.value==='main'?main:actions)[component.value]);show();}function components(){fill(component,Object.keys(main));states();}
function show(){for(const theme of ['classic','nordic']){const path=mode.value==='actions'?`form-actions/dpr-${dpr.value}/${theme}/${state.value}.png`:theme==='classic'?`../TASK-006/captures/pass-1/dpr-${dpr.value}/${component.value}--${state.value}.png`:`nordic/captures/pass-1/dpr-${dpr.value}/${component.value}--${state.value}.png`;document.getElementById(theme).src=path;document.getElementById(theme+'-link').href=path;}}
mode.onchange=components;component.onchange=states;state.onchange=dpr.onchange=show;components();
</script></html>
