<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Nordic Blue · папки и документы</title><link rel="stylesheet" href="shell.css"><style>.catalog{padding:24px 32px;display:flex;gap:18px;flex-wrap:wrap}.icon-card{width:220px;border:1px solid #dce5ef;background:white;padding:18px;border-radius:6px}.icon-card h2{font-size:14px}.sizes{display:flex;align-items:center;gap:28px;height:76px}.actual{width:16px;height:16px}.detail{width:64px;height:64px}.on-blue{background:#e3edfc;padding:10px}.caption{font-size:12px;color:#687b92}</style></head><body><header><span class="eyebrow">КАНДИДАТ / ТРЕБУЕТ ОДОБРЕНИЯ</span><h1>Папки и документы</h1><p>Жёлтые папки и синие документы по мотивам исходного эскиза. Прежний размер: 16 × 16 CSS px.</p><p class="note">SVG-мастера и отдельные экспорты PNG 1x/2x. Увеличенное изображение справа служит только для рассмотрения контура.</p><a href="index.html">← Вернуться к вариантам темы</a></header><div class="catalog" id="catalog"></div><script>for(const [name,title]of Object.entries({'folder':'Папка','folder-open':'Открытая папка','folder-rtl':'Папка RTL','folder-open-rtl':'Открытая папка RTL','leaf':'Документ'})){const card=document.createElement('section');card.className='icon-card';card.innerHTML='<h2>'+title+'</h2><div class="sizes"><img class="actual" src="icons/'+name+'.svg"><img class="detail" src="icons/'+name+'.svg"></div><div class="on-blue"><img class="actual" src="icons/'+name+'.svg"></div><p class="caption">16 × 16 · выделенная строка</p>';document.getElementById('catalog').append(card)}</script></body></html>
